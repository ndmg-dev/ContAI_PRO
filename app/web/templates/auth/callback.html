{% extends 'layouts/base.html' %}
{% block title %}Autenticando...{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:20px;">
    <div style="width:40px; height:40px; border:3px solid var(--border-color); border-top-color:var(--accent-gold); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <p style="color:var(--text-secondary); font-size:0.95rem;">Validando autenticação...</p>
    <p id="msg" style="font-size:0.82rem; color:#e05252; display:none;"></p>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script defer src="{{ url_for('static', filename='js/auth_callback.js') }}"></script>
{% endblock %}
